<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미트박스 — 내 배송 조회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="common.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C0392F">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
.eta-card{background:var(--accent);color:#fff;border:none;position:relative;overflow:hidden}
.eta-card .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;opacity:.85}
.eta-card .win{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500;margin:4px 0 2px}
.eta-card .sub{font-size:13px;opacity:.92}
.eta-card .seqbig{position:absolute;right:14px;top:10px;text-align:center;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 12px}
.eta-card .seqbig b{display:block;font-size:22px;font-family:"IBM Plex Mono",monospace;line-height:1.1}
.eta-card .seqbig span{font-size:10.5px;opacity:.85}
.order-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.order-row .k{color:var(--ink-2)}
#map{height:210px}
.status-pill{font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="phone-wrap">
  <div class="phone">
    <div class="push-layer" id="pushLayer"></div>
    <div class="phone-head">
      <span class="brand">MEAT<b>BOX</b></span>
      <span class="badge red status-pill" id="statusPill">—</span>
      <span style="margin-left:auto;font-size:12px;color:var(--ink-2)" id="whoami"></span>
    </div>
    <div class="phone-body">

      <div class="card eta-card" id="etaCard" hidden>
        <div class="lbl">배송 도착 예정</div>
        <div class="win" id="etaWin">—</div>
        <div class="sub" id="etaSub">—</div>
        <div class="seqbig" id="seqBig" hidden><b id="seqNum">-</b><span>번째 배송</span></div>
      </div>

      <div class="card">
        <div class="section-label">주문 정보</div>
        <div class="order-row"><span class="k">상호</span><b id="oShop">—</b></div>
        <div class="order-row"><span class="k">품목</span><span id="oItems">—</span></div>
        <div class="order-row"><span class="k">수량</span><b id="oBoxes">—</b></div>
        <div class="order-row"><span class="k">배송 차량</span><span id="oVehicle">—</span></div>
      </div>

      <div>
        <div class="section-label">실시간 위치</div>
        <div class="mapbox"><div id="map"></div></div>
      </div>

      <div class="card">
        <div class="section-label">배송 상태</div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div>
        <div class="section-label">카카오 알림톡</div>
        <div class="talk" id="talk"><div class="talk-empty">수신된 알림이 없습니다</div></div>
      </div>

    </div>
  </div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="static-flag.js"></script>
<script src="sim-web.js"></script>
<script src="bus.js"></script>
<script src="common.js"></script>
<script>
requireAcct();
const STATUSES = ['주문 접수','결제 완료','피킹 중','라벨 부착','상차 대기','배송 출발','N번째 순서 배송 예정','인근 배송 중','배송 완료'];

let map, vehMarker, homeMarker, mfcMarker, inited = false;
function initMap(st) {
  if (!window.L) { // 지도 로드 실패(오프라인 등) — 나머지 UI는 계속 동작
    inited = true;
    document.getElementById('map').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-2);font-size:12.5px">지도 타일을 불러올 수 없습니다 (네트워크 확인)</div>';
    return;
  }
  map = L.map('map', { zoomControl: false, attributionControl: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
  const d = st.delivery;
  homeMarker = L.marker([d.pos.lat, d.pos.lng], {
    icon: L.divIcon({ className: '', html: '<div class="stop-marker mine">집</div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
  }).addTo(map);
  mfcMarker = L.marker([st.mfc.pos.lat, st.mfc.pos.lng], {
    icon: L.divIcon({ className: '', html: '<div class="mfc-marker">🏭</div>', iconSize: [30, 30], iconAnchor: [15, 15] }),
  }).addTo(map);
  map.fitBounds([[d.pos.lat, d.pos.lng], [st.mfc.pos.lat, st.mfc.pos.lng]], { padding: [30, 30] });
  inited = true;
}

const notifWatch = makeNotifWatcher((n) => {
  showPush(document.getElementById('pushLayer'), n.title, n.body);
});

connect((st) => {
  const d = st.delivery;
  document.getElementById('whoami').textContent = `${st.me.name} · ${st.me.shop}`;
  document.title = `미트박스 — ${st.me.shop} 배송 조회`;

  // 상태 배지
  const pill = document.getElementById('statusPill');
  pill.textContent = d.status === 'N번째 순서 배송 예정' ? `${d.queuePos}번째 배송 예정` : d.status;
  pill.className = 'badge status-pill ' + (d.status === '배송 완료' ? 'green' : d.status === '인근 배송 중' ? 'red' : 'blue');

  // 주문 카드
  document.getElementById('oShop').textContent = `«${d.shop}» (${d.dong})`;
  document.getElementById('oItems').textContent = d.items;
  document.getElementById('oBoxes').textContent = d.boxes + '박스';
  document.getElementById('oVehicle').textContent = `${st.vehicle.name} · ${st.vehicle.driver}`;

  // ETA 카드
  const etaCard = document.getElementById('etaCard');
  if (d.eta && d.status !== '배송 완료') {
    etaCard.hidden = false;
    etaCard.style.background = 'var(--accent)';
    document.getElementById('etaWin').textContent = d.eta.label;
    document.getElementById('etaSub').textContent =
      d.status === '인근 배송 중' ? '기사님이 인근에서 배송 중입니다' : '실시간 교통 상황을 반영해 자동 갱신됩니다';
    const sb = document.getElementById('seqBig');
    if (d.queuePos && d.queuePos > 1) { sb.hidden = false; document.getElementById('seqNum').textContent = d.queuePos; }
    else sb.hidden = true;
  } else if (d.status === '배송 완료') {
    etaCard.hidden = false;
    etaCard.style.background = 'var(--green)';
    document.getElementById('etaWin').textContent = '배송 완료';
    document.getElementById('etaSub').textContent = '문 앞에 상품이 도착했습니다' + (d.photo ? ' · 사진 확인 가능' : '');
    document.getElementById('seqBig').hidden = true;
  } else etaCard.hidden = true;

  // 지도 (실패해도 나머지 렌더링은 계속)
  try {
    if (!inited) initMap(st);
    if (map && (st.vehicle.state === 'RUN' || st.vehicle.state === 'STOP')) {
      if (!vehMarker) {
        vehMarker = L.marker([st.vehicle.pos.lat, st.vehicle.pos.lng], {
          icon: L.divIcon({ className: '', html: `<div class="veh-marker" style="border-color:${st.vehicle.color}">🚚</div>`, iconSize: [34, 34], iconAnchor: [17, 17] }),
        }).addTo(map);
      } else vehMarker.setLatLng([st.vehicle.pos.lat, st.vehicle.pos.lng]);
    }
  } catch (e) { console.error('map:', e); }

  // 타임라인
  const done = new Map(d.history.map((h) => [h.st, h.at]));
  const curIdx = STATUSES.indexOf(d.status);
  document.getElementById('timeline').innerHTML = STATUSES.map((s, i) => {
    const at = done.get(s) || '';
    const cls = i < curIdx ? 'done' : i === curIdx ? 'current' : '';
    const name = s === 'N번째 순서 배송 예정' && i === curIdx && d.queuePos
      ? `${d.queuePos}번째 순서 배송 예정` : s;
    return `<div class="tl-item ${cls}"><div class="tl-dot"></div><div class="tl-name">${esc(name)}</div><div class="tl-time">${esc(i <= curIdx ? at : '')}</div></div>`;
  }).join('');

  // 알림톡
  const talk = document.getElementById('talk');
  if (st.notifications.length) {
    talk.innerHTML = [...st.notifications].reverse().map((n) =>
      `<div class="talk-msg"><b>${esc(n.title)}</b>${esc(n.body)}<div class="t">${esc(n.t)}</div></div>`
    ).join('');
    talk.scrollTop = talk.scrollHeight;
  }
  notifWatch(st.notifications);
});
</script>
</body>
</html>
